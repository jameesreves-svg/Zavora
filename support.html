
<!DOCTYPE html>
<html>
<head>
    <title>Zavora Support</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ZAVORA</h1>
    <h2>Help & Support</h2>

    <p>How can we help you?</p>

    <label>Your Name</label>
    <br><br>
    <input type="text" placeholder="Enter your name" id="name">
    <br><br>

    <label>Email Address</label>
    <br><br>
    <input type="email" placeholder="Enter your email" id="email">
    <br><br>

    <label>Problem Subject</label>
    <br><br>
    <input type="text" placeholder="Enter subject" id="subject">
    <br><br>

    <label>Describe Your Problem</label>
    <br><br>
    <textarea rows="5" placeholder="Write your message" id="message"></textarea>
    <br><br>

    <button onclick="submitSupport()">
        Submit Request
    </button>

    <br><br>

    <button onclick="location.href='customer-home.html'">
        Back to Wallet
    </button>

    <script src="script.js"></script>

</body>
</html>
