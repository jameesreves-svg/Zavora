
<!DOCTYPE html>
<html>
<head>
    <title>Zavora Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ZAVORA</h1>
    <h2>Customer Login</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email Address" required>
        <br><br>

        <input type="password" id="password" placeholder="Password" required>
        <br><br>

        <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://lkrgfglpvcxvsjqojbsu.supabase.co";
sb_publishable_aVvZl8A678t2yUNpdir7pA_Cs5yr6Yb
        const SUPABASE_KEY = "PASTE_YOUR_NEW_PUBLISHABLE_KEY_HERE";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            message.textContent = "Please wait...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                message.textContent = error.message;
                return;
            }

            message.textContent = "Login successful!";

            window.location.href = "1customer-home.html";
        });
    </script>

</body>
</html>
